[project]
name = "whw"
version = "0.1.0"
description = "White-Hat Weasel — autonomous AI security-audit harness over a Neo4j code graph"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "ben", email = "ben@apexai.info" }]
license = { text = "MIT" }

dependencies = [
    # Graph + MCP
    "neo4j>=5.20",
    "fastmcp>=0.4",
    # CLI + config
    "click>=8.1",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
    # Eval
    "unidiff>=0.7.5",
    # Orchestration
    "aiolimiter>=1.1",
    "anyio>=4.4",
    # Embeddings (Phase A pluggable backend)
    "sentence-transformers>=3.0",
    "einops>=0.7",          # required by nomic-embed-text-v1.5
    # Tooling
    "httpx>=0.27",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
whw = "whw.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["whw", "whw_mcp"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM", "TID"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: requires a live Neo4j on $NEO4J_URI (default bolt://localhost:7691)",
    "ingest: integration test that also drives codebase-memory-mcp (cbm)",
    "e2e: full pipeline including a real `claude -p` sub-agent (billable). Requires WHW_RUN_E2E=1.",
]
